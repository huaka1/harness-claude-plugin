<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Harness Claude Plugin 工作原理</title>
  <desc id="desc">这张图展示 Claude Code hooks 如何把项目事件写入 Harness 全局目录，再由压缩器沉淀为项目记忆，并在后续会话启动时重新注入给 Claude Code。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2L10 6L2 10" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #0F172A; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #475569; }
      .box-title { font: 700 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #0F172A; }
      .box-text { font: 500 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .label { font: 700 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1E293B; }
      .pill { font: 700 12px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #FFFFFF; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; filter: url(#shadow); }
      .soft { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1; }
      .line { stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { stroke: #64748B; stroke-width: 2; stroke-dasharray: 7 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>

  <text x="64" y="70" class="title">Harness Claude Plugin</text>
  <text x="64" y="102" class="subtitle">给 Claude Code 增加项目记忆：记录事件、压缩上下文、在未来会话中重新注入。</text>

  <rect x="64" y="158" width="270" height="170" rx="18" class="card"/>
  <rect x="88" y="184" width="58" height="58" rx="16" fill="#DBEAFE" stroke="#93C5FD"/>
  <path d="M106 215h22M106 199h22M106 231h15" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <text x="162" y="204" class="box-title">Claude Code</text>
  <text x="162" y="232" class="box-text">用户提示词</text>
  <text x="162" y="255" class="box-text">工具调用</text>
  <text x="162" y="278" class="box-text">文件修改</text>
  <text x="162" y="301" class="box-text">会话事件</text>

  <rect x="462" y="144" width="276" height="198" rx="18" class="card"/>
  <rect x="486" y="170" width="122" height="30" rx="15" fill="url(#blue)"/>
  <text x="506" y="190" class="pill">Claude Hooks</text>
  <text x="486" y="229" class="box-title">会话内快速链路</text>
  <text x="486" y="258" class="box-text">UserPromptSubmit</text>
  <text x="486" y="281" class="box-text">PostToolUse</text>
  <text x="486" y="304" class="box-text">Stop / SessionEnd</text>
  <text x="486" y="327" class="box-text">SessionStart 注入</text>

  <rect x="866" y="134" width="270" height="224" rx="18" class="card"/>
  <text x="894" y="178" class="box-title">全局记忆目录</text>
  <text x="894" y="209" class="small">~/.harness/projects/&lt;repo-id&gt;/</text>
  <rect x="894" y="232" width="214" height="38" rx="10" class="soft"/>
  <text x="913" y="256" class="small">events/*.jsonl</text>
  <rect x="894" y="284" width="214" height="38" rx="10" class="soft"/>
  <text x="913" y="308" class="small">context/*.md</text>
  <rect x="894" y="336" width="214" height="1" fill="#CBD5E1"/>

  <path d="M334 240 C382 240 402 238 448 238" class="line"/>
  <text x="356" y="218" class="label">记录</text>
  <path d="M738 238 C788 238 810 246 852 246" class="line"/>
  <text x="768" y="218" class="label">追加原始事件</text>

  <rect x="154" y="438" width="300" height="146" rx="18" class="card"/>
  <text x="184" y="481" class="box-title">后台压缩器</text>
  <text x="184" y="512" class="box-text">/harness-compact</text>
  <text x="184" y="535" class="box-text">/harness-daemon</text>
  <text x="184" y="558" class="box-text">MiniMax 或本地规则</text>

  <rect x="548" y="424" width="310" height="176" rx="18" class="card"/>
  <text x="578" y="467" class="box-title">长期项目记忆</text>
  <text x="578" y="500" class="box-text">事实、命令、链接</text>
  <text x="578" y="523" class="box-text">架构、决策</text>
  <text x="578" y="546" class="box-text">约束、踩坑</text>
  <rect x="578" y="568" width="236" height="1" fill="#CBD5E1"/>
  <text x="578" y="589" class="small">&lt;harness-memory&gt;</text>

  <path d="M964 360 C900 430 822 474 858 494" class="dash"/>
  <text x="904" y="430" class="label">压缩沉淀</text>
  <path d="M454 510 C488 510 504 510 534 510" class="line"/>
  <text x="474" y="489" class="label">写入 context</text>
  <path d="M548 442 C466 360 396 310 336 278" class="dash"/>
  <text x="404" y="368" class="label">下次会话注入</text>

  <rect x="64" y="620" width="1072" height="1" fill="#CBD5E1"/>
  <text x="64" y="649" class="subtitle">默认不污染仓库：项目记忆保存在 ~/.harness，Claude Code 只接收压缩后的上下文。</text>
</svg>
